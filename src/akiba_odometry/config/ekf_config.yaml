ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    sensor_timeout: 0.1
    two_d_mode: true
    transform_timeout: 0.5
    transform_publish_period: 0.02
    permit_corrected_publication: false
    publish_acceleration: false
    
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom
    
    # Wheel Odometry - Tek kaynak
    odom0: /odom
    odom0_config: [true,  false, false,    # x (y kapalı)
                   false, false, true,     # yaw
                   true,  false, false,    # vx (vy kapalı)
                   false, false, true,     # vyaw
                   false, false, false]    # ivmeler kapalı
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

